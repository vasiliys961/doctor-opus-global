name: MAST public dermoscopy two image research smoke
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-derm-public-two.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derm:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Evaluate two CC BY-SA 4.0 dermoscopic images without exposing diagnoses
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        run: npx vitest --config vitest.derm-public.config.ts run lib/benchmark/mast.derm-public2.live.test.ts --testTimeout=900000
      - name: Retain report and costs (no source pixels)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-opus-public-dermoscopy-two
          path: benchmark/internal-results/derm-public-two/
          retention-days: 21
          if-no-files-found: warn
