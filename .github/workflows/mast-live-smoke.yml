name: MAST one-time live model smoke
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths:
      - '.github/workflows/mast-live-smoke.yml'
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live OpenRouter call (no input/output logged)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node - <<'NODE'
          async function run() {
            if (!process.env.OPENROUTER_API_KEY) throw new Error('Missing OpenRouter secret');
            const body = {
              model: 'google/gemini-3.8-flash',
              messages: [
                {role:'system',content:'You are a clinical reasoning assistant. Give the likely diagnosis and one differential in two sentences.'},
                {role:'user',content:'Synthetic case: 44-year-old with polyuria, polydipsia, blood glucose 340 mg/dL, ketones negative. What is most likely?'}
              ],
              max_tokens: 160
            };
            const started=Date.now();
            const response=await fetch('https://openrouter.ai/api/v1/chat/completions',{
              method:'POST',
              headers:{Authorization:'Bearer '+process.env.OPENROUTER_API_KEY,'Content-Type':'application/json'},
              body:JSON.stringify(body),
              signal:AbortSignal.timeout(75000)
            });
            const j=await response.json();
            const content=j?.choices?.[0]?.message?.content;
            const passed=response.ok&&typeof content==='string'&&content.length>=5 && /diabet|hyperglyc|glycemi/i.test(content);
            console.log(JSON.stringify({http_status:response.status,success:passed,model:body.model,latency_ms:Date.now()-started,prompt_tokens:j?.usage?.prompt_tokens??null,completion_tokens:j?.usage?.completion_tokens??null,output_characters:content?.length??0,clinical_keyword_match:/diabet|hyperglyc|glycemi/i.test(content||'')}));
            if(!passed) process.exitCode=1;
          }
          run().catch(e=>{console.error('Live model request failed:', e.name);process.exitCode=1});
          NODE
