name: MAST genuine MedAgentBench v2 short FHIR tool-loop pilot
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-medagentv2-real-fhir-two.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-v2-fhir:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ericoericochen/medagentbenchv2
          ref: 46c93f39bd8679af35790eaaa5dd41bc067024a0
          path: medagentbench-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start authors' FHIR hospital test server
        shell: bash
        run: |
          set -euo pipefail
          docker pull jyxsu6/medagentbench:latest
          docker run -d --name mast-medagent-fhir --platform linux/amd64 \
            -e JAVA_TOOL_OPTIONS='-XX:+UseSerialGC -Xms256m -Xmx1024m' \
            -p 8080:8080 jyxsu6/medagentbench:latest
          for i in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/fhir/metadata > /dev/null; then
              echo 'FHIR ready'; exit 0
            fi
            sleep 3
          done
          echo 'FHIR readiness failed'; docker logs --tail 40 mast-medagent-fhir
          exit 1
      - name: Install candidate benchmark dependencies
        working-directory: benchmark
        run: npm install --no-audit --no-fund
      - name: Two official MedAgentBench v2 tasks against live FHIR server
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        working-directory: benchmark
        run: npx vitest --config vitest.medagentv2-real.config.ts run lib/benchmark/medagentbench-v2-fhir.live.test.ts --testTimeout=900000
      - name: Store only synthetic research task outputs and costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-opus-medagent-v2-2-live-fhir
          path: benchmark/internal-results/medagentbench-v2-real-fhir/
          retention-days: 21
          if-no-files-found: warn
      - name: Tear down disposable FHIR server
        if: always()
        run: docker rm -f mast-medagent-fhir || true
