name: MAST Redivis workflow metadata smoke
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-redivis-workflow-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q redivis
      - name: Check Redivis workflow metadata only
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
        run: python benchmark/scripts/redivis_workflow_metadata.py
