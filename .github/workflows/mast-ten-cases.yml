name: MAST 10-case live clinical batch
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-ten-cases.yml']
jobs:
  live-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Live consilium 10 cases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        run: npx vitest run lib/benchmark/mast.batch.test.ts --testTimeout=1800000
