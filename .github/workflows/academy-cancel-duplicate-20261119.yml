name: Stop accidental duplicated Academy mixed experiment
on:
  push:
    branches: ['bench/academy-full12-ensemble-20261119']
    paths: ['.github/workflows/academy-cancel-duplicate-20261119.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete duplicate run to avoid repeat paid inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/runs/44579875162/cancel
