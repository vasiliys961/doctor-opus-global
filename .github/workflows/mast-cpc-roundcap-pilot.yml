name: MAST contest CPC-like one-round diagnostic A/B pilot
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-cpc-roundcap-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-original-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
      - uses: actions/checkout@v4
        with:
          repository: microsoft/sdbench
          path: sdbench-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated benchmark dependencies
        run: npm install --no-audit --no-fund
        working-directory: benchmark
      - name: Evaluate two blinded open synthetic cases with capped debate and sanitized failure diagnostics
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          MAST_CONSILIUM_ROUND_CAP: '1'
        run: npx vitest --config vitest.roundcap.config.ts run lib/benchmark/mast.cpc.roundcap.pilot.live.test.ts --testTimeout=1800000
        working-directory: benchmark
      - name: Save per-case responses, failure categories and provider charges
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-opus-cpc-roundcap-two-open-synthetic
          path: benchmark/internal-results/cpc-roundcap-pilot/
          retention-days: 21
          if-no-files-found: warn
