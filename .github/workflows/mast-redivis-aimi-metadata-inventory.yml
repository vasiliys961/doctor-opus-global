name: MAST Stanford AIMI full access + permissions metadata
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-redivis-aimi-metadata-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q redivis
      - name: Inspect AIMI dataset/table metadata and research usage terms only
        run: python benchmark/scripts/redivis_aimi_dataset_inventory.py
