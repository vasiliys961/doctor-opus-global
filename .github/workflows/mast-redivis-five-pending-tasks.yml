name: MAST 2-5 real AIMI examples per pending task, no image export
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths:
      - 'benchmark/scripts/redivis_aimi_five_sample_probe.py'
      - 'benchmark/scripts/test_redivis_aimi_five_sample_probe.py'
      - '.github/workflows/mast-redivis-five-pending-tasks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  limited-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Redivis SDK and tabular reader
        run: python -m pip install -q redivis pandas pyarrow
      - name: Verify five-row and privacy limits without credentials
        run: PYTHONPATH=benchmark/scripts python -m unittest benchmark/scripts/test_redivis_aimi_five_sample_probe.py -v
      - name: Read up to five permitted label rows per target; no images or third-party calls
        run: python benchmark/scripts/redivis_aimi_five_sample_probe.py
