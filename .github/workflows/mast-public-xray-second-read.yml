name: MAST public chest X-ray critical second-read A/B pilot
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-public-xray-second-read.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run original-pixel chest X-ray research pilot (no ground-truth leakage)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          MAST_XRAY_SECOND_READ: 'true'
        run: npx vitest --config vitest.public-xray.config.ts run lib/benchmark/mast.xray-public2.live.test.ts --testTimeout=900000
      - name: Persist sanitized model results and measured billing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-opus-public-xray-second-read-two
          path: benchmark/internal-results/xray-public-two/
          retention-days: 21
          if-no-files-found: warn
