name: MAST Redivis few-file access proof without downloads
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-redivis-few-files-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q redivis
      - name: Inspect two file-index entries per clinical dataset, no image downloads
        run: python benchmark/scripts/redivis_aimi_few_files_metadata.py
