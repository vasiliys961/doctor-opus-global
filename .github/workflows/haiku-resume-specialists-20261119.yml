name: Haiku 5.5 resume only six incomplete specialist answers
on:
  push:
    branches: ['bench/haiku-all-archive-20261119']
    paths: ['.github/workflows/haiku-resume-specialists-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified successful historical Haiku replies from exact prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark/internal-results/haiku-all-archive-20261119
          gh api repos/${{ github.repository }}/actions/artifacts/14552874227/zip > /tmp/haiku-success.zip
          unzip -oq /tmp/haiku-success.zip -d benchmark/internal-results/haiku-all-archive-20261119
          test -s benchmark/internal-results/haiku-all-archive-20261119/responses.jsonl
      - name: Replay only six length-truncated specialist outputs with cumulative budget ceiling
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python benchmark/scripts/haiku-resume-specialists-20261119.py
      - name: Save complete resumed responses and cost ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-specialist-resumed-20261119
          path: benchmark/internal-results/haiku-specialist-resumed-20261119/
          retention-days: 21
          if-no-files-found: warn
