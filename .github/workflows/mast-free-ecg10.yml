name: Free VL models on 10 historical PTB-XL ECG cases
on:
  push:
    branches: ['bench/free-clinical-models-20261118']
    paths:
      - '.github/workflows/mast-free-ecg10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-ecg:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing GitHub Secret is present
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing OpenRouter key"; exit 2; }
      - name: Install public ECG rendering dependencies
        run: python -m pip install -q numpy matplotlib pillow
      - name: Reconstruct pinned original PTB-XL ECG cases without reference leakage
        run: python benchmark/scripts/prepare-free-ecg-ptbxl-20261118.py
      - name: Read first 10 original ECG images with three free VLMs
        run: python benchmark/scripts/free-ecg-10-20261118.py
      - name: Save detailed per-case outputs and summary without patient info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptbxl-ecg10-free-vlm-20261118
          path: |
            benchmark/internal-results/ecg-free-models-20261118/
          retention-days: 14
          if-no-files-found: warn
