name: Opus Benchmark branch-only NIH clinical retrieval check
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/opus-benchmark-guidelines-retrieval.yml']
permissions:
  contents: read
  actions: read
jobs:
  check-medical-guideline-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm strict NIH scope, negative HIV status and license policies
        run: node --test benchmark/rag/guidelines-lookup.test.mjs
      - name: Retrieve actual NIH text embeddings, not any MAST answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark
          gh run download 41278510617 --repo "${{ github.repository }}" --name opus-benchmark-nih-guidelines-e5-cpu --dir benchmark
          test -s benchmark/rag-index-guidelines/index.jsonl
      - name: Restore checked public embedding model
        uses: actions/cache@v4
        with:
          path: benchmark/rag/.cache
          key: benchmark-e5-small-v1
      - name: Install isolated CPU E5 runtime
        run: npm install --prefix benchmark/rag --no-audit --no-fund
      - name: Evaluate NIH clinical retrieval on independent synthetic queries
        run: node benchmark/rag/eval-guidelines.mjs benchmark/rag-index-guidelines/index.jsonl benchmark/rag-index-guidelines/retrieval-eval.json
      - name: Save scored retrieval evidence without modifying default branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus-benchmark-nih-guidelines-retrieval-check
          path: benchmark/rag-index-guidelines/retrieval-eval.json
          retention-days: 21
          if-no-files-found: warn
