name: MAST PhysicianBench-style two open-structure EHR tasks
# Retest after splitting chart retrieval from long-form note drafting for reliable tool schema.
on:
  push:
    branches: [feat/mast-consilium-adapter]
    paths: ['.github/workflows/mast-physician-style-2-open-synthetic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-public-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mast-consilium-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Clinical EHR-like tool-loop on two fictional charts, actual Sonnet model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        run: npx vitest --config vitest.physician-style.config.ts run lib/benchmark/physicianbench-simulated-ehr.live.test.ts --testTimeout=900000
      - name: Save sanitized synthetic plans and measured model costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-opus-physician-style-two-fictitious
          path: benchmark/internal-results/physicianbench-style-open-two/
          retention-days: 21
          if-no-files-found: warn
