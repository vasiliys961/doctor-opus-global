name: MAST benchmark adapter checks

on:
  pull_request:
    paths:
      - 'app/api/benchmark/mast/**'
      - 'lib/benchmark/**'
      - '.github/workflows/mast-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit test — response format
        run: npx vitest run lib/benchmark/mast.test.ts
      - name: Baseline TypeScript audit (nonblocking, existing unrelated errors)
        continue-on-error: true
        run: npx tsc --noEmit --pretty false
